<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>❤️</title>
<style>
@keyframes beat {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.3); }
}
@keyframes float {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-120vh); opacity: 0; }
}
body {
  margin: 0;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: linear-gradient(180deg, #ffccd5, #ffe6eb);
  font-family: sans-serif;
}
.center {
  text-align: center;
  z-index: 10;
}
.heart {
  font-size: 120px;
  cursor: pointer;
  animation: beat 1s infinite;
}
.text {
  margin-top: 20px;
  font-size: 28px;
  color: #b3003b;
  opacity: 0;
  transition: opacity 1s;
}
.show {
  opacity: 1;
}
.floating-heart {
  position: absolute;
  bottom: -20px;
  font-size: 24px;
  animation: float 6s linear infinite;
  opacity: 0.8;
}
.music {
  position: fixed;
  bottom: 15px;
  right: 15px;
  font-size: 14px;
  background: rgba(255,255,255,0.7);
  padding: 6px 10px;
  border-radius: 20px;
}
</style>
</head>
<body>

<div class="center">
  <div class="heart" onclick="showText()">❤️</div>
  <div class="text" id="text">我喜欢你</div>
</div>

<div class="music">🎶 音乐播放中</div>

<audio autoplay loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_6c1b41a9c6.mp3" type="audio/mpeg">
</audio>

<script>
function showText() {
  document.getElementById("text").classList.add("show");
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "floating-heart";
  heart.innerText = "💗";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = 4 + Math.random() * 4 + "s";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 8000);
}

setInterval(createHeart, 500);
</script>

</body>
</html>
