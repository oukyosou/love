<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元旦快乐</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: "Segoe UI", "Hiragino Sans", sans-serif;
  overflow: hidden;
  color: #fff;
}

.container {
  text-align: center;
  z-index: 2;
}

.heart {
  font-size: 96px;
  animation: beat 1.4s infinite;
}

@keyframes beat {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

.text {
  font-size: 30px;
  line-height: 1.6;
  margin-top: 20px;
  white-space: pre-line;
}

.hidden-btn {
  position: fixed;
  right: 6px;
  bottom: 6px;
  width: 12px;
  height: 12px;
  background: rgba(255,255,255,0.05);
  border-radius: 50%;
  cursor: pointer;
  z-index: 10;
}

.floating-heart {
  position: absolute;
  bottom: -20px;
  font-size: 20px;
  color: rgba(255,255,255,0.6);
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-120vh); opacity: 0; }
}

audio { display: none; }
</style>
</head>

<body>

<audio id="bgm" loop>
  <source src="https://cdn.pixabay.com/audio/2023/02/28/audio_5e3cc6ff42.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <div class="heart">❤️</div>
  <div class="text" id="text">
元旦快乐 🎆
あけましておめでとう 🎍
  </div>
</div>

<div class="hidden-btn" onclick="confess()"></div>

<script>
function confess() {
  document.getElementById("text").innerText =
`其实……
我喜欢你 ❤️
実は……君のことが好きです

2025，请多关照，
新的一年，也想和你一起
2025年も、よろしくね。
これからも一緒にいられたら嬉しいです。`;

  document.querySelector(".heart").style.animation = "beat 0.8s infinite";
  document.getElementById("bgm").play();
}

function createHeart() {
  const h = document.createElement("div");
  h.className = "floating-heart";
  h.innerText = "❤";
  h.style.left = Math.random() * 100 + "vw";
  h.style.animationDuration = (4 + Math.random() * 6) + "s";
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 10000);
}

setInterval(createHeart, 500);

document.body.addEventListener("click", () => {
  document.getElementById("bgm").play();
}, { once: true });
</script>

</body>
</html>
